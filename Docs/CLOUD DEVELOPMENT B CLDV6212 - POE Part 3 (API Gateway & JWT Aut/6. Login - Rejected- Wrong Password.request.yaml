$kind: http-request
name: "6. Login - Rejected: Wrong Password"
description: A wrong password must return the exact same message as an unknown email, so the endpoint cannot be used to discover which addresses are registered.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "DefinitelyWrong1"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401 Unauthorized', function () {
          pm.response.to.have.status(401);
      });

      pm.test('Same message as an unknown account (no user enumeration)', function () {
          const body = pm.response.json();
          pm.expect(body.detail).to.eql('Invalid email or password.');
      });
    language: text/javascript
order: 6000
