$kind: http-request
url: "{{baseUrl}}/documents/upload"
method: POST
headers:
  Content-Type: text/plain
body:
  type: text
  content: "Barista recipe: Pull espresso shot for 25 seconds at 9 bars pressure. Use 18g fine-ground coffee."
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201 Created', function () {
          pm.response.to.have.status(201);
      });

      pm.test('Response has fileName and size', function () {
          var json = pm.response.json();
          pm.expect(json.fileName).to.be.a('string');
          pm.expect(json.size).to.be.above(0);
      });
    language: text/javascript
order: 1000
