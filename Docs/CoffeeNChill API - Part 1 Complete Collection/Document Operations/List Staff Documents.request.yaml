$kind: http-request
url: "{{baseUrl}}/documents"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response is an array', function () {
          var json = pm.response.json();
          pm.expect(json).to.be.an('array');
      });
    language: text/javascript
order: 3000
