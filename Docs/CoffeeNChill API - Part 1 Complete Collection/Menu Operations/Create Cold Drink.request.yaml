$kind: http-request
url: "{{baseUrl}}/menu"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "PartitionKey": "Cold Drinks",
      "RowKey": "COL-001",
      "Name": "Iced Latte",
      "Description": "Cold milk coffee with ice",
      "Price": 35.00,
      "IsAvailable": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201 Created', function () {
          pm.response.to.have.status(201);
      });
    language: text/javascript
order: 2000
