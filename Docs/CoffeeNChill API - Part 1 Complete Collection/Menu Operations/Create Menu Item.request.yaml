$kind: http-request
url: "{{baseUrl}}/menu"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "PartitionKey": "Hot Drinks",
      "RowKey": "COF-001",
      "Name": "Espresso",
      "Description": "Strong Italian coffee shot",
      "Price": 25.00,
      "IsAvailable": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201 Created', function () {
          pm.response.to.have.status(201);
      });

      pm.test('Response has required fields', function () {
          var json = pm.response.json();
          pm.expect(json.PartitionKey).to.eql('Hot Drinks');
          pm.expect(json.RowKey).to.eql('COF-001');
          pm.expect(json.Name).to.eql('Espresso');
          pm.expect(json.Price).to.be.above(0);
      });
    language: text/javascript
order: 1000
