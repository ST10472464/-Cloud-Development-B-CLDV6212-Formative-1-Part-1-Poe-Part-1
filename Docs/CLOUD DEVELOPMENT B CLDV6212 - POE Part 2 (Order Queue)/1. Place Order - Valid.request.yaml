$kind: http-request
url: "{{baseUrl}}/orders/queue"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \  \"OrderId\": \"ORD-2026-8801\",\r

    \  \"CustomerName\": \"Jane Smith\",\r

    \  \"SelectedItemSKUs\": [\"COF-001\", \"PAS-104\"],\r

    \  \"TotalPrice\": 65.00,\r

    \  \"OrderTimestamp\": \"2026-10-12T10:15:00Z\"\r

    }"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Order was queued successfully', function () {
          const body = pm.response.json();
          pm.expect(body.message).to.eql('Order queued successfully');
          pm.expect(body.orderId).to.eql('ORD-2026-8801');
      });

      pm.test('Response is JSON', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Response time under 2000 ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
    language: text/javascript
order: 1000
